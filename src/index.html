<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WinkProject</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    app-root {
      display: block;
      min-height: 100vh;
    }
    /* Простой loader для начальной загрузки */
    app-root:empty::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 102, 0, 0.1);
      border-top-color: #FF6600;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
