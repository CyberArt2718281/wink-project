<header
  class="w-full bg-black py-4 px-4 md:px-8 flex items-center justify-between sticky top-0 z-40 border-b border-[#232323] backdrop-blur-sm bg-black/95">
  <!-- Логотип -->
  <div class="logo">
    <picture class="flex items-center">
      <source srcset="assets/images/logo.avif" type="image/avif">
      <img src="assets/images/logo.svg" alt="Логотип" class="w-[133px] h-[33px] object-contain" />
    </picture>
  </div>

  <!-- Desktop nav -->
  <nav class="hidden md:flex gap-8">
    <a routerLink="/upload"
       routerLinkActive="text-[#FF6600]"
       [routerLinkActiveOptions]="{ exact: true }"
       class="text-white hover:text-[#FF6600] font-medium transition-colors duration-200 relative group">
      {{ 'HEADER.UPLOAD' | translate }}
      <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#FF6600] transition-all duration-200 group-hover:w-full"
            [class.w-full]="isRouteActive('/upload')"></span>
    </a>
    <a routerLink="/table"
       routerLinkActive="text-[#FF6600]"
       [routerLinkActiveOptions]="{ exact: true }"
       class="text-white hover:text-[#FF6600] font-medium transition-colors duration-200 relative group">
      {{ 'HEADER.TABLE' | translate }}
      <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#FF6600] transition-all duration-200 group-hover:w-full"
            [class.w-full]="isRouteActive('/table')"></span>
    </a>
  </nav>

  <!-- Правая часть: языковой селект и бургер -->
  <div class="flex items-center gap-4">
    <!-- Языковой селект -->
    <div class="hidden md:block">
      <p-select
        [options]="languageOptions"
        [(ngModel)]="selectedLanguage"
        (onChange)="onLanguageChange($event)"
        optionLabel="label"
        [appendTo]="'body'"
        styleClass="!bg-[#1A1A1A] !border-[#232323] !text-white [&_.p-dropdown-label]:!text-gray-300 [&_.p-dropdown-panel]:!bg-[#1A1A1A] [&_.p-dropdown-panel]:!border-[#232323] min-w-[100px]"
        [dropdownIcon]="'pi pi-globe'">
        <ng-template pTemplate="selectedItem">
          <div class="flex items-center gap-2">
            <i class="pi pi-globe text-[#FF6600] text-sm"></i>
            <span class="text-white text-sm">{{ selectedLanguage.label }}</span>
          </div>
        </ng-template>
        <ng-template let-language pTemplate="item">
          <div class="flex items-center gap-2">
            <i class="pi pi-globe text-[#FF6600] text-sm"></i>
            <span class="text-white">{{ language.label }}</span>
          </div>
        </ng-template>
      </p-select>
    </div>

    <!-- Burger for mobile -->
    <div class="md:hidden relative">
      <button
        class="p-2 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#FF6600] focus:ring-opacity-50 transition-all duration-200 hover:bg-[#232323]"
        (click)="toggleMenu()"
        [attr.aria-label]="'HEADER.MENU' | translate"
        [attr.aria-expanded]="menuOpen">
        @if (!menuOpen) {
          <svg class="w-7 h-7 text-[#FF6600]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        } @else {
          <svg class="w-7 h-7 text-[#FF6600]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        }
      </button>

      @if (menuOpen) {
        <div
          class="absolute right-0 top-12 bg-[#1A1A1A] shadow-2xl rounded-xl py-4 px-6 flex flex-col gap-3 z-50 w-64 border border-[#232323] animate-slide-fade-in">
          <!-- Мобильный языковой селект -->
          <div class="mb-2">
            <p-select
              [options]="languageOptions"
              [(ngModel)]="selectedLanguage"
              (onChange)="onLanguageChange($event)"
              optionLabel="label"
              [appendTo]="'body'"
              styleClass="!bg-[#232323] !border-[#333333] !text-white [&_.p-dropdown-label]:!text-gray-300 [&_.p-dropdown-panel]:!bg-[#1A1A1A] [&_.p-dropdown-panel]:!border-[#232323] w-full"
              [dropdownIcon]="'pi pi-globe'">
              <ng-template pTemplate="selectedItem">
                <div class="flex items-center gap-2">
                  <i class="pi pi-globe text-[#FF6600] text-sm"></i>
                  <span class="text-white text-sm">{{ selectedLanguage.label }}</span>
                </div>
              </ng-template>
              <ng-template let-language pTemplate="item">
                <div class="flex items-center gap-2">
                  <i class="pi pi-globe text-[#FF6600] text-sm"></i>
                  <span class="text-white">{{ language.label }}</span>
                </div>
              </ng-template>
            </p-select>
          </div>

          <!-- Навигационные ссылки -->
          <a routerLink="/upload"
             routerLinkActive="text-[#FF6600] bg-[#232323]"
             [routerLinkActiveOptions]="{ exact: true }"
             class="text-white hover:text-[#FF6600] hover:bg-[#232323] font-medium transition-all duration-200 rounded-lg px-3 py-2 flex items-center gap-2"
             (click)="closeMenu()">
            <i class="pi pi-upload text-sm"></i>
            {{ 'HEADER.UPLOAD' | translate }}
          </a>
          <a routerLink="/table"
             routerLinkActive="text-[#FF6600] bg-[#232323]"
             [routerLinkActiveOptions]="{ exact: true }"
             class="text-white hover:text-[#FF6600] hover:bg-[#232323] font-medium transition-all duration-200 rounded-lg px-3 py-2 flex items-center gap-2"
             (click)="closeMenu()">
            <i class="pi pi-table text-sm"></i>
            {{ 'HEADER.TABLE' | translate }}
          </a>
        </div>
      }
    </div>
  </div>
</header>
