<div class="settings-upload-container relative">
  <button
    pButton
    [label]="'SETTINGS_UPLOAD.BUTTON' | translate"
    class="settings-button !bg-[#1A1A1A] !border-[#232323] !text-gray-300 !text-xs sm:!text-sm hover:!bg-[#232323] hover:!text-white transition-all duration-200 inter-regular !rounded-[40px]"
    (click)="openModal()"
  >
    <i class="pi pi-cog mr-1 sm:mr-2 shrink-0"></i>
  </button>

  @if (modalOpen) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-300"
    (click)="closeModal()"
  ></div>

  <!-- Modal -->
  <div
    class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-[#1A1A1A] border border-[#232323] rounded-xl shadow-2xl z-50 w-[95vw] max-w-4xl max-h-[90vh] overflow-hidden animate-scale-in mobile-modal"
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between p-4 sm:p-6 border-b border-[#232323] bg-[#1A1A1A] sticky top-0"
    >
      <div>
        <h3 class="text-lg sm:text-xl font-bold text-white inter-extra-bold">
          {{ 'SETTINGS_UPLOAD.TITLE' | translate }}
        </h3>
        <p class="text-gray-400 text-xs sm:text-sm mt-1 inter-regular">
          {{ 'SETTINGS_UPLOAD.SUBTITLE' | translate }}
        </p>
      </div>
      <button
        (click)="closeModal()"
        class="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#232323] rounded-lg transition-colors inter-regular"
      >
        <i class="pi pi-times text-sm sm:text-base shrink-0"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="flex flex-col h-[calc(90vh-120px)]">
      <div class="flex-1 overflow-auto custom-scroll">
        <div class="p-4 sm:p-6">
          <!-- Preset Selection -->
          <div class="mb-6 sm:mb-8">
            <h4
              class="text-white font-semibold mb-3 sm:mb-4 flex items-center gap-2 text-sm sm:text-base inter-medium"
            >
              <i class="pi pi-sliders-h text-[#FF6600] shrink-0"></i>
              {{ 'SETTINGS_UPLOAD.PRESET_SELECTION' | translate }}
            </h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3">
              <label
                class="preset-option flex flex-col p-3 sm:p-4 rounded-lg border-2 border-[#232323] hover:border-[#FF6600] cursor-pointer transition-all duration-200 group has-[:checked]:border-[#FF6600] has-[:checked]:bg-[#FF6600]/5 inter-regular"
              >
                <input
                  type="radio"
                  name="preset"
                  value="basic"
                  [(ngModel)]="selectedPreset"
                  class="hidden"
                  (change)="applyPreset('basic')"
                />
                <div class="flex items-center gap-2 sm:gap-3 mb-2">
                  <div
                    class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border-2 border-[#232323] group-has-[:checked]:border-[#FF6600] group-has-[:checked]:bg-[#FF6600] flex items-center justify-center"
                  >
                    <div
                      class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-white opacity-0 group-has-[:checked]:opacity-100 transition-opacity"
                    ></div>
                  </div>
                  <span
                    class="font-medium text-white group-has-[:checked]:text-[#FF6600] text-xs sm:text-sm inter-medium"
                    >{{ 'SETTINGS_UPLOAD.BASIC' | translate }}</span
                  >
                </div>
                <p class="text-gray-400 text-xs ml-5 sm:ml-7 inter-regular">
                  {{ 'SETTINGS_UPLOAD.BASIC_DESC' | translate }}
                </p>
              </label>

              <label
                class="preset-option flex flex-col p-3 sm:p-4 rounded-lg border-2 border-[#232323] hover:border-[#FF6600] cursor-pointer transition-all duration-200 group has-[:checked]:border-[#FF6600] has-[:checked]:bg-[#FF6600]/5 inter-regular"
              >
                <input
                  type="radio"
                  name="preset"
                  value="extended"
                  [(ngModel)]="selectedPreset"
                  class="hidden"
                  (change)="applyPreset('extended')"
                />
                <div class="flex items-center gap-2 sm:gap-3 mb-2">
                  <div
                    class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border-2 border-[#232323] group-has-[:checked]:border-[#FF6600] group-has-[:checked]:bg-[#FF6600] flex items-center justify-center"
                  >
                    <div
                      class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-white opacity-0 group-has-[:checked]:opacity-100 transition-opacity"
                    ></div>
                  </div>
                  <span
                    class="font-medium text-white group-has-[:checked]:text-[#FF6600] text-xs sm:text-sm inter-medium"
                    >{{ 'SETTINGS_UPLOAD.ADVANCED' | translate }}</span
                  >
                </div>
                <p class="text-gray-400 text-xs ml-5 sm:ml-7 inter-regular">
                  {{ 'SETTINGS_UPLOAD.ADVANCED_DESC' | translate }}
                </p>
              </label>
              <label
                class="preset-option flex flex-col p-3 sm:p-4 rounded-lg border-2 border-[#232323] hover:border-[#FF6600] cursor-pointer transition-all duration-200 group has-[:checked]:border-[#FF6600] has-[:checked]:bg-[#FF6600]/5 inter-regular"
              >
                <input
                  type="radio"
                  name="preset"
                  value="full"
                  [(ngModel)]="selectedPreset"
                  class="hidden"
                  (change)="applyPreset('full')"
                />
                <div class="flex items-center gap-2 sm:gap-3 mb-2">
                  <div
                    class="w-3 h-3 sm:w-4 sm:h-4 rounded-full border-2 border-[#232323] group-has-[:checked]:border-[#FF6600] group-has-[:checked]:bg-[#FF6600] flex items-center justify-center"
                  >
                    <div
                      class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-white opacity-0 group-has-[:checked]:opacity-100 transition-opacity"
                    ></div>
                  </div>
                  <span
                    class="font-medium text-white group-has-[:checked]:text-[#FF6600] text-xs sm:text-sm inter-medium"
                    >{{ 'SETTINGS_UPLOAD.FULL' | translate }}</span
                  >
                </div>
                <p class="text-gray-400 text-xs ml-5 sm:ml-7 inter-regular">
                  {{ 'SETTINGS_UPLOAD.FULL_DESC' | translate }}
                </p>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="border-t border-[#232323] bg-[#1A1A1A] p-4 sm:p-6 sticky bottom-0">
        <div class="flex flex-col sm:flex-row gap-3 justify-end items-center">
          <div class="flex gap-2 sm:gap-3 w-full sm:w-auto">
            <button
              type="button"
              class="flex-1 sm:flex-none px-4 sm:px-6 py-2 bg-[#232323] text-gray-300 rounded-lg hover:bg-[#2A2A2A] hover:text-white transition-colors duration-200 font-medium text-sm sm:text-base inter-medium"
              (click)="closeModal()"
            >
              {{ 'SETTINGS_UPLOAD.CANCEL' | translate }}
            </button>
            <button
              type="button"
              class="flex-1 sm:flex-none px-4 sm:px-6 py-2 bg-[#FF6600] text-white rounded-lg hover:bg-[#FF8533] transition-colors duration-200 font-medium shadow-lg hover:shadow-[#FF6600]/25 flex items-center justify-center gap-2 text-sm sm:text-base inter-medium gradient-button"
              (click)="saveSettings()"
            >
              <i class="pi pi-check shrink-0"></i>
              {{ 'SETTINGS_UPLOAD.SAVE' | translate }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
