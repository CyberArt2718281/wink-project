<div class="settings-upload-container relative">
  <button pButton
          [label]="'SETTINGS_UPLOAD.BUTTON' | translate"
          class="!bg-gray-800 !border-gray-700 !text-gray-300 !text-sm hover:!bg-gray-700 hover:!border-gray-600 hover:!text-white transition-all duration-200"
          (click)="openModal()">
    <i class="pi pi-cog mr-2"></i>
  </button>

  @if (modalOpen) {
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-300"
         (click)="closeModal()"></div>

    <!-- Modal -->
    <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl z-50 w-11/12 max-w-md animate-scale-in">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b border-gray-700">
        <h3 class="text-lg font-bold text-white">{{ 'SETTINGS_UPLOAD.TITLE' | translate }}</h3>
        <button (click)="closeModal()"
                class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition-colors">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <!-- Form -->
      <form (ngSubmit)="saveSettings()" class="p-6">
        <div class="space-y-3 mb-6">
          <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-600 hover:border-orange-500 cursor-pointer transition-all duration-200 group has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10">
            <input type="radio" name="preset" value="basic" [(ngModel)]="selectedPreset"
                   class="w-4 h-4 text-orange-500 border-gray-600 focus:ring-orange-500 focus:ring-2 bg-gray-700">
            <div class="flex-1">
              <span class="font-medium text-white group-has-[:checked]:text-orange-500">{{ 'SETTINGS_UPLOAD.BASIC' | translate }}</span>
              <p class="text-sm text-gray-400 mt-1">{{ 'SETTINGS_UPLOAD.BASIC_DESC' | translate }}</p>
            </div>
          </label>

          <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-600 hover:border-orange-500 cursor-pointer transition-all duration-200 group has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10">
            <input type="radio" name="preset" value="advanced" [(ngModel)]="selectedPreset"
                   class="w-4 h-4 text-orange-500 border-gray-600 focus:ring-orange-500 focus:ring-2 bg-gray-700">
            <div class="flex-1">
              <span class="font-medium text-white group-has-[:checked]:text-orange-500">{{ 'SETTINGS_UPLOAD.ADVANCED' | translate }}</span>
              <p class="text-sm text-gray-400 mt-1">{{ 'SETTINGS_UPLOAD.ADVANCED_DESC' | translate }}</p>
            </div>
          </label>

          <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-600 hover:border-orange-500 cursor-pointer transition-all duration-200 group has-[:checked]:border-orange-500 has-[:checked]:bg-orange-500/10">
            <input type="radio" name="preset" value="full" [(ngModel)]="selectedPreset"
                   class="w-4 h-4 text-orange-500 border-gray-600 focus:ring-orange-500 focus:ring-2 bg-gray-700">
            <div class="flex-1">
              <span class="font-medium text-white group-has-[:checked]:text-orange-500">{{ 'SETTINGS_UPLOAD.FULL' | translate }}</span>
              <p class="text-sm text-gray-400 mt-1">{{ 'SETTINGS_UPLOAD.FULL_DESC' | translate }}</p>
            </div>
          </label>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 justify-end">
          <button type="button"
                  class="px-4 py-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600 hover:text-white transition-colors duration-200 font-medium"
                  (click)="closeModal()">
            {{ 'SETTINGS_UPLOAD.CANCEL' | translate }}
          </button>
          <button type="submit"
                  class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-400 transition-colors duration-200 font-medium shadow-lg hover:shadow-orange-500/25">
            {{ 'SETTINGS_UPLOAD.SAVE' | translate }}
          </button>
        </div>
      </form>
    </div>
  }
</div>
